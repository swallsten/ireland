<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Ballyconneely to Spiddal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%A5%BE</text></svg>">
<style>
:root{
  --ground:#E9ECE8;
  --surface:#F6F8F4;
  --surface-2:#DCE2DA;
  --ink:#161D1A;
  --ink-2:#3E4A44;
  --muted:#6C7A72;
  --rule:#C5CEC4;
  --rule-soft:#D8DFD6;
  --accent:#2B5946;
  --accent-ink:#2B5946;
  --accent-soft:#D5E2DA;
  --road:#9E4B1B;
  --road-ink:#9E4B1B;
  --road-soft:#F0DFD3;

  --f-display:"Petrona",Georgia,"Times New Roman",serif;
  --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;

  --measure:44rem;
  --s1:.35rem; --s2:.7rem; --s3:1.1rem; --s4:1.7rem; --s5:2.6rem; --s6:4rem;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111614;
    --surface:#191F1C;
    --surface-2:#232B27;
    --ink:#E4EAE4;
    --ink-2:#AFBBB3;
    --muted:#7C8981;
    --rule:#2C3531;
    --rule-soft:#232B27;
    --accent:#7FC3A3;
    --accent-ink:#8FCFB0;
    --accent-soft:#1C2B24;
    --road:#DE8B57;
    --road-ink:#E79A69;
    --road-soft:#2A1F18;
  }
}
:root[data-theme="dark"]{
  --ground:#111614;
  --surface:#191F1C;
  --surface-2:#232B27;
  --ink:#E4EAE4;
  --ink-2:#AFBBB3;
  --muted:#7C8981;
  --rule:#2C3531;
  --rule-soft:#232B27;
  --accent:#7FC3A3;
  --accent-ink:#8FCFB0;
  --accent-soft:#1C2B24;
  --road:#DE8B57;
  --road-ink:#E79A69;
  --road-soft:#2A1F18;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:16.5px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:var(--measure);margin:0 auto;padding:var(--s5) 1.35rem var(--s6)}
p{margin:0 0 var(--s3)}
a{color:var(--accent-ink);text-decoration-thickness:1px;text-underline-offset:2px}
a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
strong{font-weight:600;color:var(--ink)}
hr{border:0;border-top:1px solid var(--rule);margin:var(--s5) 0}

/* ---- masthead ---- */
.mast{display:flex;flex-direction:column;gap:var(--s3);padding-bottom:var(--s4);border-bottom:2px solid var(--ink)}
.eyebrow{
  font-family:var(--f-mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin:0;
}
h1{
  font-family:var(--f-display);font-weight:600;font-size:clamp(2.5rem,8vw,4rem);
  line-height:.98;letter-spacing:-.02em;margin:0;text-wrap:balance;
}
h1 em{font-style:italic;font-weight:400;color:var(--accent-ink)}
.dek{font-size:1.06rem;color:var(--ink-2);margin:0;max-width:34rem}

/* ---- at a glance ---- */
.glance{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(102px,1fr));gap:2px;
  margin:var(--s4) 0 var(--s5);background:var(--rule-soft);border:1px solid var(--rule);
}
.gday{background:var(--surface);padding:.7rem .65rem .75rem;display:flex;flex-direction:column;gap:.3rem}
.gday .d{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.gday .t{font-family:var(--f-display);font-size:1rem;line-height:1.15;font-weight:600;letter-spacing:-.01em}
.gday .b{font-size:.72rem;color:var(--muted)}
/* glance blocks are links to their day */
a.gday{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent;
  transition:background .12s ease;cursor:pointer}
a.gday .t{text-decoration:underline;text-decoration-thickness:1px;
  text-decoration-color:var(--rule);text-underline-offset:3px}
a.gday:hover{background:var(--surface-2)}
a.gday:hover .t{text-decoration-color:var(--accent)}
a.gday:active{background:var(--rule-soft)}
a.gday:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.what h3 a{color:inherit;text-decoration:underline;text-decoration-thickness:1px;
  text-decoration-color:var(--rule);text-underline-offset:3px}
.what h3 a:hover{text-decoration-color:var(--accent);color:var(--accent-ink)}
.warn-note{background:var(--road-soft);border-left:2px solid var(--road);padding:.55rem .75rem;
  font-size:.88rem;color:var(--ink-2);margin:.6rem 0 0}
.mapline{margin:.9rem 0 0;font-size:.92rem}
.mapline a{font-weight:600}
.mapline span{color:var(--muted);font-size:.86rem;display:block;margin-top:.15rem}

/* reference strip: jump links to the sections that follow the week */
.refnav{
  display:flex;flex-wrap:wrap;gap:2px;
  margin:0 0 var(--s5);background:var(--rule-soft);border:1px solid var(--rule);
}
.glance + .refnav{margin-top:calc(-1 * var(--s5) + 2px)}
.refnav a{
  flex:1 1 auto;min-width:6rem;min-height:44px;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface);padding:.55rem .7rem;
  font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;
  -webkit-tap-highlight-color:transparent;transition:background .12s ease,color .12s ease;
}
.refnav a:hover{background:var(--surface-2);color:var(--accent-ink)}
.refnav a:active{background:var(--rule-soft)}
.refnav a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
@media print{.refnav{display:none}}

/* keep the sticky top bar from covering the heading you jump to */
section.day,section.sec{scroll-margin-top:calc(var(--stick, 4.5rem) + .7rem)}
html{scroll-behavior:smooth}

/* ---- load meter ---- */
.load{display:inline-flex;align-items:center;gap:.32rem;vertical-align:middle}
.load i{display:block;width:.42rem;height:.42rem;border-radius:50%;background:var(--rule);}
.load i.on{background:var(--accent)}
.load .lbl{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-left:.2rem}

/* ---- day sections ---- */
.day{margin:0 0 var(--s6);scroll-margin-top:1rem}
.dayhead{border-top:2px solid var(--ink);padding-top:var(--s2);margin-bottom:var(--s4)}
.dayhead .meta{
  display:flex;flex-wrap:wrap;align-items:center;gap:.55rem .95rem;
  font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  margin-bottom:.55rem;
}
.dayhead h2{
  font-family:var(--f-display);font-weight:600;font-size:clamp(1.6rem,4.4vw,2.15rem);
  line-height:1.08;letter-spacing:-.015em;margin:0 0 .55rem;text-wrap:balance;
}
.dayhead .intro{color:var(--ink-2);margin:0;font-size:1rem}

.base{color:var(--accent-ink)}

/* ---- timeline rows ---- */
.rows{display:flex;flex-direction:column;gap:1px;background:var(--rule-soft);border-top:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft)}
.row{background:var(--ground);display:grid;grid-template-columns:5.1rem 1fr;gap:0 1.15rem;padding:.95rem 0}
.row .when{
  font-family:var(--f-mono);font-size:.79rem;font-variant-numeric:tabular-nums;
  color:var(--ink-2);padding-top:.14rem;letter-spacing:-.01em;
}
.row .what{min-width:0}
.row h3{font-family:var(--f-body);font-size:1rem;font-weight:600;margin:0 0 .28rem;line-height:1.35}
.row p{margin:0 0 .5rem;font-size:.94rem;color:var(--ink-2)}
.row p:last-child{margin-bottom:0}

.row.leg{background:var(--road-soft)}
.row.leg .when{color:var(--road-ink)}
.row.leg h3{
  font-family:var(--f-mono);font-size:.76rem;font-weight:500;letter-spacing:.08em;
  text-transform:uppercase;color:var(--road-ink);margin-bottom:.2rem;
}
.row.leg p{color:var(--ink-2);font-size:.88rem}

.pin{
  display:inline-block;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;
  text-transform:uppercase;padding:.13rem .42rem;border-radius:2px;
  background:var(--accent-soft);color:var(--accent-ink);margin-left:.4rem;vertical-align:.09em;
  white-space:nowrap;
}
.pin.warn{background:var(--road-soft);color:var(--road-ink)}

.tally{
  font-family:var(--f-mono);font-size:.76rem;color:var(--muted);
  padding-top:.9rem;border-top:1px solid var(--rule);margin-top:0;
}

/* ---- callout ---- */
.note{
  background:var(--surface);border-left:3px solid var(--accent);
  padding:1rem 1.15rem;margin:var(--s3) 0;
}
.note.hot{border-left-color:var(--road)}
.note h4{
  font-family:var(--f-mono);font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;
  margin:0 0 .45rem;color:var(--accent-ink);
}
.note.hot h4{color:var(--road-ink)}
.note p{margin:0 0 .6rem;font-size:.94rem;color:var(--ink-2)}
.note p:last-child{margin-bottom:0}

/* ---- generic section ---- */
.sec{margin:0 0 var(--s5)}
.sec > h2{
  font-family:var(--f-display);font-weight:600;font-size:1.75rem;letter-spacing:-.015em;
  margin:0 0 var(--s2);line-height:1.1;
}
.sec > .sub{color:var(--muted);font-size:.94rem;margin:0 0 var(--s3)}

ol.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:flex;flex-direction:column;gap:.75rem}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:1.9rem 1fr;gap:.75rem;align-items:baseline}
ol.steps li::before{
  content:counter(s,decimal-leading-zero);font-family:var(--f-mono);font-size:.74rem;
  color:var(--accent-ink);font-variant-numeric:tabular-nums;
}
ol.steps li .txt{font-size:.96rem;color:var(--ink-2)}
ol.steps li .txt b{color:var(--ink);font-weight:600}

ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.8rem}
ul.plain li{
  padding-left:1.05rem;position:relative;font-size:.96rem;color:var(--ink-2);
}
ul.plain li::before{
  content:"";position:absolute;left:0;top:.62em;width:.4rem;height:1px;background:var(--muted);
}
ul.plain li b{color:var(--ink);font-weight:600}

.risks{display:flex;flex-direction:column;gap:1.15rem;counter-reset:r;margin:0;padding:0;list-style:none}
.risks li{counter-increment:r;border-left:2px solid var(--road);padding-left:1rem}
.risks li h4{
  font-family:var(--f-body);font-size:.98rem;font-weight:600;margin:0 0 .25rem;
}
.risks li h4::before{
  content:counter(r) ". ";font-family:var(--f-mono);font-size:.8rem;color:var(--road-ink);
}
.risks li p{margin:0;font-size:.93rem;color:var(--ink-2)}

.foot{border-top:2px solid var(--ink);padding-top:var(--s3);margin-top:var(--s5);color:var(--muted);font-size:.82rem;font-family:var(--f-mono);line-height:1.7}

/* ---- wheel chart ---- */
.wheel{margin:0 0 var(--s5)}
.wheel h2{
  font-family:var(--f-display);font-weight:600;font-size:1.4rem;letter-spacing:-.015em;
  margin:0 0 .3rem;line-height:1.15;
}
.wheel .sub{color:var(--muted);font-size:.88rem;margin:0 0 var(--s3)}
.bars{display:grid;grid-template-columns:3.6rem 1fr 2.9rem;gap:.42rem .7rem;align-items:center}
.bars .bday{
  font-family:var(--f-mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap;
}
.bars .track{height:.72rem;background:var(--rule-soft);border-radius:0 2px 2px 0}
.bars .fill{height:100%;background:var(--road);border-radius:0 4px 4px 0;min-width:3px}
.bars .val{
  font-family:var(--f-mono);font-size:.76rem;font-variant-numeric:tabular-nums;
  color:var(--ink-2);text-align:right;
}
.wheel .tot{
  display:flex;align-items:baseline;gap:.6rem;margin-top:var(--s3);
  padding-top:.8rem;border-top:1px solid var(--rule);
}
.wheel .tot .n{font-family:var(--f-display);font-size:2.1rem;font-weight:600;line-height:1;color:var(--road-ink);letter-spacing:-.02em}
.wheel .tot .cap{font-size:.9rem;color:var(--muted)}

@media (max-width:620px){
  .row{grid-template-columns:1fr;gap:.25rem}
  .row .when{padding-top:0;font-size:.74rem;letter-spacing:.05em;color:var(--muted)}
  .row.leg .when{color:var(--road-ink)}
  .glance{grid-template-columns:repeat(2,1fr)}
  a.gday{min-height:60px;padding:.8rem .7rem .85rem;justify-content:center}
  a.gday .t{font-size:1.02rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}}
@media print{
  body{background:#fff;color:#000}
  .day{break-inside:avoid}
}

/* ---- reference tables ---- */
.tblwrap{overflow-x:auto;border:1px solid var(--rule);background:var(--surface)}
table.ref{border-collapse:collapse;width:100%;min-width:34rem;font-size:.88rem}
table.ref th,table.ref td{text-align:left;padding:.6rem .75rem;border-bottom:1px solid var(--rule)}
table.ref thead th{
  font-family:var(--f-mono);font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);font-weight:500;background:var(--surface-2);white-space:nowrap;
}
table.ref tbody tr:last-child td{border-bottom:0}
table.ref td.nm{font-weight:600;color:var(--ink);white-space:nowrap}
table.ref td.hrs{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2);white-space:nowrap}
table.ref td.note{color:var(--ink-2)}
table.ref td .no{color:var(--road-ink);font-weight:600}
table.ref td .yes{color:var(--accent-ink);font-weight:600}

/* ---- meal grid ---- */
.meals{display:flex;flex-direction:column;gap:1px;background:var(--rule-soft);border:1px solid var(--rule)}
.mrow{background:var(--surface);display:grid;grid-template-columns:4.4rem 1fr;gap:0 1rem;padding:.7rem .8rem}
.mrow .md{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:.15rem}
.mrow .mm{display:flex;flex-direction:column;gap:.22rem;font-size:.89rem;color:var(--ink-2);min-width:0}
.mrow .mm span b{color:var(--ink);font-weight:600}
.tag{
  display:inline-block;font-family:var(--f-mono);font-size:.6rem;letter-spacing:.09em;text-transform:uppercase;
  padding:.1rem .36rem;border-radius:2px;margin-right:.42rem;vertical-align:.08em;white-space:nowrap;
}
.tag.out{background:var(--accent-soft);color:var(--accent-ink)}
.tag.home{background:var(--surface-2);color:var(--ink-2)}
.tag.pack{background:var(--road-soft);color:var(--road-ink)}
@media (max-width:620px){
  .mrow{grid-template-columns:1fr;gap:.3rem}
}

/* ============ shell: gate ============ */
.gate{
  min-height:100svh;display:flex;align-items:center;justify-content:center;
  padding:1.5rem;background:var(--ground);
}
.gate-card{
  width:100%;max-width:23rem;background:var(--surface);
  border:1px solid var(--rule);padding:1.9rem 1.7rem 1.7rem;
}
.gate-card .eyebrow{margin-bottom:.55rem}
.gate-card h1{font-size:clamp(1.9rem,7vw,2.4rem);margin-bottom:.7rem}
.gate-card p{font-size:.92rem;color:var(--ink-2);margin-bottom:1.2rem}
.gate-field{display:flex;flex-direction:column;gap:.5rem}
label.lbl-t{
  font-family:var(--f-mono);font-size:.65rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);
}
input[type="password"],input[type="text"],textarea{
  font-family:var(--f-body);font-size:.95rem;color:var(--ink);
  background:var(--ground);border:1px solid var(--rule);
  padding:.6rem .7rem;width:100%;border-radius:0;
}
textarea{resize:vertical;min-height:4.5rem;line-height:1.5}
input:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}
button.btn{
  font-family:var(--f-body);font-size:.9rem;font-weight:600;cursor:pointer;
  background:var(--accent);color:var(--ground);border:1px solid var(--accent);
  padding:.6rem 1.1rem;border-radius:0;
}
:root[data-theme="dark"] button.btn,
:root:not([data-theme="light"]) button.btn{color:var(--ground)}
button.btn:hover{opacity:.88}
button.btn[disabled]{opacity:.5;cursor:progress}
button.ghost{
  font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;
  background:none;border:1px solid var(--rule);color:var(--ink-2);
  padding:.4rem .7rem;cursor:pointer;border-radius:0;
}
button.ghost:hover{border-color:var(--accent);color:var(--accent-ink)}
.gate-err{
  color:var(--road-ink);font-size:.85rem;margin:.7rem 0 0;min-height:1.2em;
}

/* ============ shell: top bar ============ */
.topstack{position:sticky;top:0;z-index:30}
.bar{
  background:var(--ground);
  border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;
  padding:.55rem 1.35rem;
}
.bar .who{
  font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;
  color:var(--muted);margin-right:auto;
}
.bar .who b{color:var(--accent-ink);font-weight:600}
.bar .dot{
  display:inline-block;width:.4rem;height:.4rem;border-radius:50%;
  background:var(--muted);margin-right:.4rem;vertical-align:.05em;
}
.bar .dot.live{background:var(--accent)}
.bar .dot.down{background:var(--road)}

.updated[hidden]{display:none}
.updated{
  display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  padding:.6rem 1.35rem;background:var(--accent-soft);
  border-bottom:1px solid var(--rule);
  font-size:.85rem;color:var(--accent-ink);
}
.updated button.ghost{margin-left:auto}

/* ============ shell: comment threads ============ */
.thread{margin:1.4rem 0 0;border-top:1px solid var(--rule)}
.thread-toggle{
  display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;
  background:none;border:0;cursor:pointer;padding:.75rem 0;
  font-family:var(--f-mono);font-size:.7rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);
}
.thread-toggle:hover{color:var(--accent-ink)}
.thread-toggle .chev{
  display:inline-block;transition:transform .15s ease;font-size:.8rem;color:var(--muted);
}
.thread[open-thread] .thread-toggle .chev{transform:rotate(90deg)}
.thread-toggle .count{
  font-family:var(--f-mono);font-size:.68rem;padding:.08rem .4rem;
  background:var(--accent-soft);color:var(--accent-ink);border-radius:2px;
}
.thread-toggle .count.zero{background:var(--surface-2);color:var(--muted)}
.thread-body{display:none;padding:0 0 1.1rem}
.thread[open-thread] .thread-body{display:block}
.notes{list-style:none;margin:0 0 1rem;padding:0;display:flex;flex-direction:column;gap:.75rem}
.note-item{
  background:var(--surface);border-left:2px solid var(--accent);
  padding:.6rem .8rem;
}
.note-item .meta{
  font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;
  color:var(--muted);margin-bottom:.25rem;
}
.note-item .meta b{color:var(--accent-ink);font-weight:600;letter-spacing:.04em}
.note-item p{margin:0;font-size:.93rem;color:var(--ink-2);white-space:pre-wrap}
.thread-form{display:flex;flex-direction:column;gap:.55rem;max-width:34rem}
.thread-form .row2{display:flex;gap:.55rem;align-items:flex-end;flex-wrap:wrap}
.thread-form .row2 input{max-width:12rem}
.thread-form .say{font-size:.8rem;color:var(--muted);margin:0}
.thread-off{
  font-size:.85rem;color:var(--muted);background:var(--surface);
  border-left:2px solid var(--rule);padding:.6rem .8rem;margin:0 0 .8rem;
}
@media (max-width:620px){
  /* iOS Safari zooms the page when focusing an input smaller than 16px */
  input[type="password"],input[type="text"],textarea{font-size:16px}
  /* comfortable thumb targets */
  .thread-toggle{min-height:48px}
  button.btn{padding:.7rem 1.15rem}
  /* stack the name field and post button instead of cramming them side by side */
  .thread-form{max-width:none}
  .thread-form .row2{flex-direction:column;align-items:stretch;gap:.5rem}
  .thread-form .row2 input{max-width:none;width:100%}
  .bar{padding:.5rem .95rem;gap:.5rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.bar,.updated,.thread-toggle,.thread-form{display:none!important}.thread-body{display:block!important}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <p class="eyebrow">1 &ndash; 8 September 2026</p>
    <h1>Ballyconneely<br><em>to</em> Spiddal</h1>
    <p>This page is encrypted. Enter the passphrase Scott sent you.</p>
    <form class="gate-field" id="gate-form">
      <label class="lbl-t" for="pw">Passphrase</label>
      <input type="password" id="pw" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <button class="btn" type="submit" id="unlock">Unlock</button>
    </form>
    <p class="gate-err" id="gate-err" role="status" aria-live="polite"></p>
  </div>
</div>

<div id="app" hidden>
  <div class="topstack">
  <div class="bar">
    <span class="who" id="who"><span class="dot" id="dot"></span><span id="who-txt">Loading notes</span></span>
    <button class="ghost" id="refresh" type="button">Refresh notes</button>
    <button class="ghost" id="rename" type="button">Change name</button>
    <button class="ghost" id="lock" type="button">Log out</button>
  </div>
  <div class="updated" id="updated" hidden>
    <span>This itinerary has been updated.</span>
    <button class="ghost" id="reload-new" type="button">Load the new version</button>
  </div>
  </div>
  <div id="doc"></div>
</div>

<script>
(function () {
  "use strict";

  var CACHE_KEY = "ireland.doc.v1";
  var FP_KEY    = "ireland.fp.v1";   // fingerprint of the payload the cache came from
  var NAME_KEY  = "ireland.name.v1";
  var PASS_KEY  = "ireland.pass.v1";  // remembered so an update does not send you back to the gate
  var POLL_MS   = 60000;

  var cfg = { supabaseUrl: "", supabaseAnonKey: "" };
  var threads = {};      // key -> {listEl, countEl}
  var me = "";
  var pollTimer = null;
  var pendingFp = null;  // iv of the payload most recently decrypted
  var lastPass  = null;  // the passphrase that last worked, for silent re-decrypts

  // ---------- tiny helpers ----------
  function $(id) { return document.getElementById(id); }
  function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function b64ToBytes(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function slug(s) {
    return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60);
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function when(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }

  // ---------- unlock ----------
  async function decrypt(passphrase) {
    var res = await fetch("payload.json", { cache: "no-store" });
    if (!res.ok) throw new Error("Could not load payload.json");
    var p = await res.json();
    pendingFp = p.iv || null;
    lastPass = passphrase;
    var baseKey = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"]
    );
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64ToBytes(p.salt), iterations: p.iterations, hash: "SHA-256" },
      baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
    );
    var clear = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(p.iv) }, key, b64ToBytes(p.data)
    );
    return JSON.parse(new TextDecoder().decode(clear));
  }

  function boot(data, cacheIt) {
    cfg.supabaseUrl = data.supabaseUrl || "";
    cfg.supabaseAnonKey = data.supabaseAnonKey || "";
    $("doc").innerHTML = data.html;
    $("gate").hidden = true;
    $("gate").style.display = "none";
    $("app").hidden = false;
    if (cacheIt) {
      try { store(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
      if (pendingFp) store(FP_KEY, pendingFp);
      if (lastPass) store(PASS_KEY, lastPass);
    }
    me = recall(NAME_KEY) || "";
    buildThreads();
    if (cfg.supabaseUrl && cfg.supabaseAnonKey) {
      loadNotes();
      pollTimer = setInterval(function () {
        if (document.visibilityState === "visible") loadNotes(true);
      }, POLL_MS);
    } else {
      setStatus("down", "Notes not configured yet");
    }
  }

  $("gate-form").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var btn = $("unlock"), err = $("gate-err");
    btn.disabled = true; btn.textContent = "Unlocking"; err.textContent = "";
    try {
      var data = await decrypt($("pw").value.trim());
      boot(data, true);
    } catch (e) {
      err.textContent = "That passphrase does not open this page.";
      btn.disabled = false; btn.textContent = "Unlock";
      $("pw").select();
    }
  });

  // try the cached copy first, so a reload with no signal still works
  // The cached copy is shown instantly so the page still opens with no signal.
  // If we are online and payload.json has changed since that copy was made,
  // offer the new one rather than silently showing a stale itinerary.
  async function checkForUpdate() {
    var known = recall(FP_KEY);
    if (!known) return;
    try {
      var res = await fetch("payload.json", { cache: "no-store" });
      if (!res.ok) return;
      var p = await res.json();
      if (!p || !p.iv || p.iv === known) return;

      // The payload moved on. If this device remembers the passphrase, fetch
      // the new version and swap it in, rather than sending someone back to
      // the gate over a change they did not make.
      var saved = recall(PASS_KEY);
      if (saved) {
        try {
          boot(await decrypt(saved), true);
          flashUpdated();
          return;
        } catch (e) { store(PASS_KEY, null); }
      }
      $("updated").hidden = false;
    } catch (e) { /* offline: keep showing the cached copy */ }
  }

  // Brief confirmation, so the page never changes under you in silence.
  function flashUpdated() {
    var bar = $("updated"), label = bar.querySelector("span"), btn = $("reload-new");
    label.textContent = "Updated to the newest version.";
    btn.hidden = true;
    bar.hidden = false;
    setTimeout(function () {
      bar.hidden = true;
      btn.hidden = false;
      label.textContent = "This itinerary has been updated.";
    }, 12000);
  }

  // The sticky header changes height: it wraps on narrow screens and grows
  // when the update banner appears. Publish its height so section anchors
  // can offset by the right amount instead of a guess.
  (function stickHeight() {
    var stack = document.querySelector(".topstack");
    if (!stack) return;
    var sync = function () {
      document.documentElement.style.setProperty("--stick", stack.offsetHeight + "px");
    };
    sync();
    if (window.ResizeObserver) new ResizeObserver(sync).observe(stack);
    window.addEventListener("resize", sync);
  })();

  (function tryCache() {
    var raw = recall(CACHE_KEY);
    if (raw) {
      try { boot(JSON.parse(raw), false); checkForUpdate(); return; }
      catch (e) { store(CACHE_KEY, null); store(FP_KEY, null); }
    }
    // No cached copy, but this device may still know the passphrase.
    var saved = recall(PASS_KEY);
    if (saved) {
      decrypt(saved).then(function (data) { boot(data, true); })
                    .catch(function () { store(PASS_KEY, null); });
    }
  })();

  $("reload-new").addEventListener("click", function () {
    store(CACHE_KEY, null);
    store(FP_KEY, null);
    location.reload();
  });

  $("lock").addEventListener("click", function () {
    store(CACHE_KEY, null);
    store(FP_KEY, null);
    store(PASS_KEY, null);
    location.reload();
  });

  // ---------- threads ----------
  function threadKeyFor(section) {
    var m = section.querySelector(".dayhead .meta > span");
    if (m) return "day-" + slug(m.textContent);
    var h = section.querySelector("h2");
    if (h) return "sec-" + slug(h.textContent);
    return null;
  }

  function buildThreads() {
    var doc = $("doc");
    var targets = [];
    threads = {};   // a re-boot replaces #doc, so drop references to the old nodes

    // a general thread up top, before the first day
    var first = doc.querySelector("section.day");
    if (first) {
      var gen = document.createElement("section");
      gen.className = "sec";
      gen.setAttribute("data-general", "");
      gen.innerHTML = '<h2 style="font-size:1.4rem;margin:0 0 .3rem">Notes for the group</h2>' +
        '<p class="sub" style="margin:0 0 .2rem">Anything that is not about one particular day. ' +
        'Every section below has its own thread too.</p>';
      first.parentNode.insertBefore(gen, first);
      targets.push(["general", gen]);
    }

    Array.prototype.forEach.call(doc.querySelectorAll("section.day, section.sec:not([data-general])"), function (sec) {
      if (sec.querySelector(".thread")) return;
      var key = threadKeyFor(sec);
      if (key) targets.push([key, sec]);
    });

    targets.forEach(function (pair) {
      var key = pair[0], sec = pair[1];
      var label = key === "general" ? "Group notes" : "Notes on this section";
      var wrap = document.createElement("div");
      wrap.className = "thread";
      wrap.setAttribute("data-key", key);
      wrap.innerHTML =
        '<button class="thread-toggle" type="button" aria-expanded="false">' +
          '<span class="chev">&rsaquo;</span><span>' + label + '</span>' +
          '<span class="count zero">0</span></button>' +
        '<div class="thread-body">' +
          '<ul class="notes"></ul>' +
          (cfg.supabaseUrl && cfg.supabaseAnonKey
            ? '<form class="thread-form">' +
                '<textarea required maxlength="2000" placeholder="Add a note the other four will see"></textarea>' +
                '<div class="row2">' +
                  '<input type="text" class="author" maxlength="40" placeholder="Your name" required>' +
                  '<button class="btn" type="submit">Post note</button>' +
                '</div>' +
                '<p class="say"></p>' +
              '</form>'
            : '<p class="thread-off">Notes are not switched on yet. See step 2 of the README.</p>') +
        '</div>';
      sec.appendChild(wrap);

      var toggle = wrap.querySelector(".thread-toggle");
      toggle.addEventListener("click", function () {
        var open = wrap.hasAttribute("open-thread");
        if (open) { wrap.removeAttribute("open-thread"); } else { wrap.setAttribute("open-thread", ""); }
        toggle.setAttribute("aria-expanded", String(!open));
      });

      var form = wrap.querySelector(".thread-form");
      if (form) {
        var authorInput = form.querySelector(".author");
        if (me) authorInput.value = me;
        form.addEventListener("submit", function (ev) {
          ev.preventDefault();
          postNote(key, form);
        });
      }

      threads[key] = {
        list: wrap.querySelector(".notes"),
        count: wrap.querySelector(".count"),
        wrap: wrap
      };
    });
  }

  // ---------- supabase ----------
  function headers(extra) {
    var h = {
      apikey: cfg.supabaseAnonKey,
      Authorization: "Bearer " + cfg.supabaseAnonKey
    };
    for (var k in (extra || {})) h[k] = extra[k];
    return h;
  }

  function setStatus(state, text) {
    $("dot").className = "dot " + (state || "");
    $("who-txt").textContent = text;
  }

  function loadNotes(quiet) {
    if (!quiet) setStatus("", "Loading notes");
    fetch(cfg.supabaseUrl + "/rest/v1/comments?select=id,created_at,author,section,body&order=created_at.asc", {
      headers: headers(), cache: "no-store"
    })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (rows) {
        render(rows);
        var n = rows.length;
        var tally = n + (n === 1 ? " note" : " notes");
        if (me) {
          $("who").innerHTML = '<span class="dot live"></span>You are <b>' + esc(me) + '</b> &middot; ' + tally;
        } else {
          $("who").innerHTML = '<span class="dot live"></span>' + tally + ' &middot; open a section to read them';
        }
      })
      .catch(function () {
        setStatus("down", "Cannot reach the notes right now");
      });
  }

  function render(rows) {
    Object.keys(threads).forEach(function (k) {
      threads[k].list.innerHTML = "";
      threads[k].count.textContent = "0";
      threads[k].count.classList.add("zero");
    });
    rows.forEach(function (row) {
      var t = threads[row.section] || threads.general;
      if (!t) return;
      var li = document.createElement("li");
      li.className = "note-item";
      li.innerHTML = '<div class="meta"><b>' + esc(row.author) + '</b> · ' + esc(when(row.created_at)) + '</div>' +
                     '<p>' + esc(row.body) + '</p>';
      t.list.appendChild(li);
      var c = parseInt(t.count.textContent, 10) + 1;
      t.count.textContent = String(c);
      t.count.classList.remove("zero");
    });
  }

  function postNote(key, form) {
    var body = form.querySelector("textarea").value.trim();
    var author = form.querySelector(".author").value.trim();
    var say = form.querySelector(".say");
    var btn = form.querySelector("button");
    if (!body || !author) return;
    me = author; store(NAME_KEY, author);
    btn.disabled = true; say.textContent = "Posting";
    fetch(cfg.supabaseUrl + "/rest/v1/comments", {
      method: "POST",
      headers: headers({ "Content-Type": "application/json", Prefer: "return=minimal" }),
      body: JSON.stringify({ author: author, section: key, body: body })
    })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        form.querySelector("textarea").value = "";
        say.textContent = "Posted";
        setTimeout(function () { say.textContent = ""; }, 2500);
        loadNotes(true);
      })
      .catch(function () {
        say.textContent = "That did not send. Check your signal and try again.";
      })
      .finally(function () { btn.disabled = false; });
  }

  $("refresh").addEventListener("click", function () { loadNotes(); });
  $("rename").addEventListener("click", function () {
    var n = prompt("What name should the others see?", me || "");
    if (n === null) return;
    n = n.trim().slice(0, 40);
    if (!n) return;
    me = n; store(NAME_KEY, n);
    Array.prototype.forEach.call(document.querySelectorAll(".thread-form .author"), function (i) { i.value = n; });
    loadNotes(true);
  });
})();
</script>
</body>
</html>
